services:

  postgres:
    image: postgres:17-alpine
    container_name: taskmanager-postgres
    restart: unless-stopped

    env_file:
      - ./backend/.env

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network

  redis:
    image: redis:7-alpine
    container_name: taskmanager-redis
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: taskmanager-backend:1.0.0

    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: redis://redis:6379

    ports:
      - "127.0.0.1:4000:4000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 3

    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
